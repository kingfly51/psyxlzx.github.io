<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理健康平台 · 登录</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EEF6FF 0%, #E8F5F0 50%, #FEF9F0 100%);
      position: relative;
      overflow: hidden;
    }
    /* 背景装饰 */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59,130,184,0.08) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(76,175,138,0.08) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      pointer-events: none;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-brand .logo {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(59,130,184,0.3);
    }
    .auth-brand .logo i { color: #fff; font-size: 1.6rem; }
    .auth-brand h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
    .auth-brand p { font-size: 0.9rem; color: var(--text-secondary); margin-top: 4px; }
    .auth-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.8);
      overflow: hidden;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
    }
    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }
    .auth-tab.active {
      color: var(--primary);
    }
    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%; right: 20%;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }
    .auth-tab:hover:not(.active) { background: var(--bg-sidebar); }
    .auth-form-wrap { padding: 28px; }
    .auth-panel { display: none; animation: fadeIn 0.3s ease; }
    .auth-panel.active { display: block; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .input-icon-wrap .form-control { padding-left: 38px; }
    .input-icon-wrap .eye-toggle {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
    }
    .input-icon-wrap .eye-toggle:hover { color: var(--text-primary); }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(59,130,184,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59,130,184,0.45); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn[disabled] { opacity: 0.7; cursor: not-allowed; transform: none; }
    .forgot-link { font-size: 0.85rem; color: var(--primary); float: right; margin-top: -2px; }
    .forgot-link:hover { text-decoration: underline; }
    .auth-terms {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .auth-terms a { color: var(--primary); }
    /* 找回密码面板 */
    #forgot-panel {
      display: none;
      padding: 28px;
    }
    #forgot-panel.show { display: block; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 20px; cursor: pointer; }
    .back-link:hover { color: var(--text-primary); }
    /* 底部装饰 */
    .auth-footer {
      text-align: center;
      padding: 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .auth-footer span { color: var(--accent); font-weight: 500; }
    /* 研究声明 */
    .research-notice {
      background: rgba(59,130,184,0.06);
      border: 1px solid rgba(59,130,184,0.15);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.83rem;
      color: var(--text-secondary);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .research-notice i { color: var(--primary); margin-top: 1px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo"><i class="fas fa-brain"></i></div>
      <h1>认知重构平台</h1>
      <p>基于认知行为疗法的心理健康研究系统</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>

      <div class="auth-form-wrap" id="auth-forms">
        <!-- 登录面板 -->
        <div class="auth-panel active" id="login-panel">
          <div class="research-notice">
            <i class="fas fa-shield-alt"></i>
            <span>本平台用于认知重构研究，您的数据将被匿名化处理并用于学术分析。</span>
          </div>
          <form id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label">用户名</label>
              <div class="input-icon-wrap">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="login-username" class="form-control" placeholder="请输入用户名" autocomplete="username">
              </div>
              <span class="form-error" id="login-username-err"></span>
            </div>
            <div class="form-group">
              <label class="form-label" style="display:flex;justify-content:space-between">
                <span>密码</span>
                <a href="#" class="forgot-link" id="forgot-link">忘记密码？</a>
              </label>
              <div class="input-icon-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="login-password" class="form-control" placeholder="请输入密码" autocomplete="current-password">
                <button type="button" class="eye-toggle" data-target="login-password"><i class="fas fa-eye-slash"></i></button>
              </div>
              <span class="form-error" id="login-password-err"></span>
            </div>
            <button type="submit" class="submit-btn" id="login-btn">
              <span>登录</span>
            </button>
          </form>
        </div>

        <!-- 注册面板 -->
        <div class="auth-panel" id="register-panel">
          <form id="register-form" novalidate>
            <div class="form-group">
              <label class="form-label">用户名 <span style="color:#EF4444">*</span></label>
              <div class="input-icon-wrap">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="reg-username" class="form-control" placeholder="4-20位字母数字" autocomplete="username">
              </div>
              <span class="form-error" id="reg-username-err"></span>
            </div>
            <div class="form-group">
              <label class="form-label">密码 <span style="color:#EF4444">*</span></label>
              <div class="input-icon-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="reg-password" class="form-control" placeholder="至少8位" autocomplete="new-password">
                <button type="button" class="eye-toggle" data-target="reg-password"><i class="fas fa-eye-slash"></i></button>
              </div>
              <span class="form-error" id="reg-password-err"></span>
            </div>
            <div class="form-group">
              <label class="form-label">确认密码 <span style="color:#EF4444">*</span></label>
              <div class="input-icon-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="reg-confirm" class="form-control" placeholder="再次输入密码" autocomplete="new-password">
                <button type="button" class="eye-toggle" data-target="reg-confirm"><i class="fas fa-eye-slash"></i></button>
              </div>
              <span class="form-error" id="reg-confirm-err"></span>
            </div>
            <div class="form-group">
              <label class="form-label">邮箱（选填，用于找回密码）</label>
              <div class="input-icon-wrap">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="reg-email" class="form-control" placeholder="your@email.com" autocomplete="email">
              </div>
              <span class="form-error" id="reg-email-err"></span>
            </div>
            <div class="form-group">
              <label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="reg-consent" style="width:16px;height:16px;">
                <span style="font-size:0.85rem;">我同意参与本研究，且数据将用于学术分析</span>
              </label>
              <span class="form-error" id="reg-consent-err"></span>
            </div>
            <button type="submit" class="submit-btn" id="register-btn">
              <span>创建账号</span>
            </button>
          </form>
        </div>
      </div>

      <!-- 找回密码面板 -->
      <div id="forgot-panel">
        <div class="back-link" id="back-to-login">
          <i class="fas fa-arrow-left"></i> 返回登录
        </div>
        <h3 style="font-size:1.1rem;margin-bottom:8px;">找回密码</h3>
        <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:20px;">请联系研究员重置密码，或通过注册邮箱验证身份。</p>
        <div class="form-group">
          <label class="form-label">注册邮箱</label>
          <div class="input-icon-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="forgot-email" class="form-control" placeholder="请输入注册邮箱">
          </div>
        </div>
        <button class="submit-btn" id="forgot-btn">
          <span>发送重置邮件</span>
        </button>
      </div>
    </div>

    <div class="auth-footer">
      <span>认知重构研究平台</span> · 基于认知行为疗法（CBT）
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // 标签切换
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
      });
    });

    // 密码显示切换
    document.querySelectorAll('.eye-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fas fa-eye';
        } else {
          input.type = 'password';
          icon.className = 'fas fa-eye-slash';
        }
      });
    });

    // 找回密码切换
    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('auth-tabs').style.display = 'none';
      document.getElementById('auth-forms').style.display = 'none';
      document.getElementById('forgot-panel').classList.add('show');
    });
    document.getElementById('back-to-login').addEventListener('click', () => {
      document.getElementById('auth-tabs').style.display = '';
      document.getElementById('auth-forms').style.display = '';
      document.getElementById('forgot-panel').classList.remove('show');
    });

    // 登录
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      let valid = true;

      if (!username) { showFieldError('login-username', 'login-username-err', '请输入用户名'); valid = false; }
      else clearFieldError('login-username', 'login-username-err');
      if (!password) { showFieldError('login-password', 'login-password-err', '请输入密码'); valid = false; }
      else clearFieldError('login-password', 'login-password-err');
      if (!valid) return;

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>登录中...</span>';

      try {
        const res = await apiPost('/api/auth/login', { username, password });
        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast('登录成功，欢迎回来！', 'success');
          setTimeout(() => window.location.href = 'chat.html', 800);
        } else {
          showToast(res.message || '登录失败', 'error');
        }
      } catch(err) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>登录</span>';
      }
    });

    // 注册
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const email = document.getElementById('reg-email').value.trim();
      const consent = document.getElementById('reg-consent').checked;
      let valid = true;

      if (!username || username.length < 4 || username.length > 20 || !/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) {
        showFieldError('reg-username', 'reg-username-err', '用户名4-20位，仅含字母数字下划线'); valid = false;
      } else clearFieldError('reg-username', 'reg-username-err');

      if (!password || password.length < 8) {
        showFieldError('reg-password', 'reg-password-err', '密码至少8位'); valid = false;
      } else clearFieldError('reg-password', 'reg-password-err');

      if (password !== confirm) {
        showFieldError('reg-confirm', 'reg-confirm-err', '两次密码不一致'); valid = false;
      } else clearFieldError('reg-confirm', 'reg-confirm-err');

      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('reg-email', 'reg-email-err', '邮箱格式不正确'); valid = false;
      } else clearFieldError('reg-email', 'reg-email-err');

      if (!consent) {
        document.getElementById('reg-consent-err').textContent = '请阅读并同意研究条款';
        document.getElementById('reg-consent-err').classList.add('show');
        valid = false;
      } else {
        document.getElementById('reg-consent-err').classList.remove('show');
      }
      if (!valid) return;

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>注册中...</span>';

      try {
        const res = await apiPost('/api/auth/register', { username, password, email });
        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          showToast('注册成功！', 'success');
          setTimeout(() => window.location.href = 'chat.html', 800);
        } else {
          showToast(res.message || '注册失败', 'error');
        }
      } catch(err) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>创建账号</span>';
      }
    });

    // 找回密码
    document.getElementById('forgot-btn').addEventListener('click', async () => {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) { showToast('请输入邮箱', 'warning'); return; }
      try {
        const res = await apiPost('/api/auth/forgot-password', { email });
        showToast(res.message || '若邮箱存在，重置链接已发送', 'info');
      } catch { showToast('请联系研究员重置密码', 'info'); }
    });

    function showFieldError(inputId, errId, msg) {
      document.getElementById(inputId).classList.add('error');
      const errEl = document.getElementById(errId);
      errEl.textContent = msg;
      errEl.classList.add('show');
    }
    function clearFieldError(inputId, errId) {
      document.getElementById(inputId).classList.remove('error');
      document.getElementById(errId).classList.remove('show');
    }

    // 检查是否已登录
    if (localStorage.getItem('token')) {
      window.location.href = 'chat.html';
    }
  </script>
</body>
</html>
