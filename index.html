<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心境 · MindCare</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">🌿</div>
        <h1 class="brand-name">心境</h1>
        <p class="brand-tagline">认知重构 · 心理健康研究平台</p>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">登录</button>
        <button class="tab-btn" data-tab="register">注册</button>
      </div>

      <!-- 登录表单 -->
      <div id="login-form" class="auth-form active">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-password">
            <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
            <button class="pw-toggle" type="button" onclick="togglePassword('login-password', this)">👁</button>
          </div>
        </div>
        <div id="login-msg" class="form-msg"></div>
        <button class="btn-primary" onclick="doLogin()">登 录</button>
        <div class="form-footer">
          <a href="#" onclick="showForgotPassword()">忘记密码？</a>
        </div>
      </div>

      <!-- 注册表单 -->
      <div id="register-form" class="auth-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="reg-username" placeholder="请输入用户名（3-20位字母数字）">
        </div>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="reg-nickname" placeholder="请输入您的昵称">
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-password">
            <input type="password" id="reg-password" placeholder="至少6位密码">
            <button class="pw-toggle" type="button" onclick="togglePassword('reg-password', this)">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <div class="input-password">
            <input type="password" id="reg-password2" placeholder="再次输入密码">
            <button class="pw-toggle" type="button" onclick="togglePassword('reg-password2', this)">👁</button>
          </div>
        </div>
        <div id="reg-msg" class="form-msg"></div>
        <button class="btn-primary" onclick="doRegister()">注 册</button>
      </div>
    </div>
  </div>

  <!-- 忘记密码弹窗 -->
  <div id="forgot-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <h3>找回密码</h3>
      <p>请联系研究人员重置密码，或发送邮件至：<br><strong>support@mindcare-research.com</strong></p>
      <button class="btn-secondary" onclick="document.getElementById('forgot-modal').style.display='none'">关闭</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
