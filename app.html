<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心境 · MindCare</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-body">

  <!-- 主内容区 -->
  <main class="app-main" id="app-main">

    <!-- ===== 聊天列表页 ===== -->
    <section id="page-chat" class="page active">
      <div class="page-header">
        <h2>对话</h2>
        <button class="icon-btn" onclick="startNewConversation()" title="新对话">＋</button>
      </div>
      <div id="conversation-list" class="conversation-list">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <p>还没有对话记录</p>
          <button class="btn-primary" onclick="startNewConversation()">开始第一次对话</button>
        </div>
      </div>
    </section>

    <!-- ===== 练习页 ===== -->
    <section id="page-practice" class="page">
      <div class="page-header">
        <h2>练习</h2>
      </div>
      <div class="practice-content">
        <div class="practice-section">
          <h3 class="section-title">冥想音频</h3>
          <div class="audio-list" id="meditation-list"></div>
        </div>
        <div class="practice-section">
          <h3 class="section-title">呼吸练习</h3>
          <div class="audio-list" id="breathing-list"></div>
        </div>
        <div class="practice-section">
          <h3 class="section-title">放松训练</h3>
          <div class="audio-list" id="relaxation-list"></div>
        </div>
      </div>
    </section>

    <!-- ===== 日历页 ===== -->
    <section id="page-calendar" class="page">
      <div class="page-header">
        <h2>日历</h2>
        <button class="icon-btn" onclick="showAnalysis()">📊</button>
      </div>
      <div class="calendar-container">
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <span id="cal-month-label"></span>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <div class="quick-record">
          <h4>今日快速记录</h4>
          <div class="quick-btns">
            <button class="quick-btn" data-key="exercise" onclick="toggleQuick(this)">🏃 运动</button>
            <button class="quick-btn" data-key="sugary_drink" onclick="toggleQuick(this)">🧃 含糖饮料</button>
            <button class="quick-btn" data-key="sedentary" onclick="toggleQuick(this)">🪑 久坐</button>
            <button class="quick-btn" data-key="high_salt" onclick="toggleQuick(this)">🧂 高盐饮食</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 个人中心页 ===== -->
    <section id="page-profile" class="page">
      <div class="page-header">
        <h2>个人中心</h2>
      </div>
      <div class="profile-content">
        <div class="avatar-section">
          <div class="avatar-wrap" onclick="changeAvatar()">
            <div id="user-avatar" class="user-avatar">😊</div>
            <div class="avatar-edit">更换</div>
          </div>
          <div id="profile-name" class="profile-username">加载中...</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" id="stat-conversations">0</div>
            <div class="stat-label">总对话数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="stat-messages">0</div>
            <div class="stat-label">总消息数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" id="stat-days">0</div>
            <div class="stat-label">记录天数</div>
          </div>
        </div>

        <div class="profile-form">
          <h3>个人信息</h3>
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="pf-nickname" placeholder="昵称">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>年龄</label>
              <input type="number" id="pf-age" placeholder="年龄" min="1" max="120">
            </div>
            <div class="form-group">
              <label>性别</label>
              <select id="pf-gender">
                <option value="">请选择</option>
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>职业</label>
            <input type="text" id="pf-occupation" placeholder="职业">
          </div>
          <div class="form-group">
            <label>教育背景</label>
            <select id="pf-education">
              <option value="">请选择</option>
              <option value="high_school">高中及以下</option>
              <option value="college">大专</option>
              <option value="bachelor">本科</option>
              <option value="master">硕士</option>
              <option value="phd">博士及以上</option>
            </select>
          </div>
          <button class="btn-primary" onclick="saveProfile()">保存信息</button>
        </div>

        <button class="btn-logout" onclick="doLogout()">退出登录</button>
      </div>
    </section>

  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="chat" onclick="switchPage('chat', this)">
      <span class="nav-icon">💬</span>
      <span class="nav-label">聊天</span>
    </button>
    <button class="nav-item" data-page="practice" onclick="switchPage('practice', this)">
      <span class="nav-icon">🎧</span>
      <span class="nav-label">练习</span>
    </button>
    <button class="nav-item" data-page="calendar" onclick="switchPage('calendar', this)">
      <span class="nav-icon">📅</span>
      <span class="nav-label">日历</span>
    </button>
    <button class="nav-item" data-page="profile" onclick="switchPage('profile', this)">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </button>
  </nav>

  <!-- ===== 聊天界面（全屏覆盖） ===== -->
  <div id="chat-screen" class="chat-screen" style="display:none">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChatScreen()">←</button>
      <h3 id="chat-title" class="chat-title">对话</h3>
      <div class="chat-menu-wrap">
        <button class="icon-btn" onclick="toggleChatMenu()">⋮</button>
        <div id="chat-menu" class="chat-menu" style="display:none">
          <div onclick="pinCurrentConversation()">置顶对话</div>
          <div onclick="clearCurrentConversation()">清空记录</div>
        </div>
      </div>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <textarea id="chat-input" class="chat-input" placeholder="输入消息..." rows="1"
        onkeydown="handleChatKey(event)" oninput="autoResizeInput(this)"></textarea>
      <button id="send-btn" class="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- ===== 每日问卷弹窗 ===== -->
  <div id="questionnaire-modal" class="modal-overlay" style="display:none">
    <div class="modal-card large">
      <div class="modal-header">
        <h3>每日健康记录</h3>
        <button onclick="closeQuestionnaire()">✕</button>
      </div>
      <div class="questionnaire-body">
        <p class="q-date" id="q-date-label"></p>
        <div class="q-item">
          <label>睡眠质量 <span class="q-score" id="sleep-val">5</span></label>
          <input type="range" min="1" max="10" value="5" id="q-sleep" oninput="updateScore('sleep-val', this.value)">
          <div class="q-labels"><span>极差</span><span>极好</span></div>
        </div>
        <div class="q-item">
          <label>焦虑程度 <span class="q-score" id="anxiety-val">5</span></label>
          <input type="range" min="1" max="10" value="5" id="q-anxiety" oninput="updateScore('anxiety-val', this.value)">
          <div class="q-labels"><span>完全不焦虑</span><span>极度焦虑</span></div>
        </div>
        <div class="q-item">
          <label>抑郁程度 <span class="q-score" id="depression-val">5</span></label>
          <input type="range" min="1" max="10" value="5" id="q-depression" oninput="updateScore('depression-val', this.value)">
          <div class="q-labels"><span>完全无抑郁</span><span>极度抑郁</span></div>
        </div>
        <div class="q-item">
          <label>幸福感 <span class="q-score" id="wellbeing-val">5</span></label>
          <input type="range" min="1" max="10" value="5" id="q-wellbeing" oninput="updateScore('wellbeing-val', this.value)">
          <div class="q-labels"><span>非常低落</span><span>非常幸福</span></div>
        </div>
        <div class="q-item">
          <label>总体健康 <span class="q-score" id="health-val">5</span></label>
          <input type="range" min="1" max="10" value="5" id="q-health" oninput="updateScore('health-val', this.value)">
          <div class="q-labels"><span>很差</span><span>很好</span></div>
        </div>
      </div>
      <button class="btn-primary" onclick="submitQuestionnaire()">提交记录</button>
    </div>
  </div>

  <!-- ===== 日期详情弹窗 ===== -->
  <div id="day-detail-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="day-detail-title">日期详情</h3>
        <button onclick="document.getElementById('day-detail-modal').style.display='none'">✕</button>
      </div>
      <div id="day-detail-content" class="day-detail-content"></div>
    </div>
  </div>

  <!-- ===== 数据分析弹窗 ===== -->
  <div id="analysis-modal" class="modal-overlay" style="display:none">
    <div class="modal-card xlarge">
      <div class="modal-header">
        <h3>数据分析</h3>
        <button onclick="document.getElementById('analysis-modal').style.display='none'">✕</button>
      </div>
      <div class="analysis-body">
        <div class="analysis-overview">
          <div class="overview-card"><div class="ov-num" id="ov-sleep">--</div><div class="ov-label">平均睡眠质量</div></div>
          <div class="overview-card"><div class="ov-num" id="ov-wellbeing">--</div><div class="ov-label">平均幸福感</div></div>
          <div class="overview-card"><div class="ov-num" id="ov-anxiety">--</div><div class="ov-label">平均焦虑指数</div></div>
          <div class="overview-card"><div class="ov-num" id="ov-depression">--</div><div class="ov-label">平均抑郁指数</div></div>
        </div>
        <div class="chart-grid">
          <div class="chart-box full">
            <h4>心理健康趋势</h4>
            <canvas id="trend-chart"></canvas>
          </div>
          <div class="chart-box half">
            <h4>当前综合状态</h4>
            <canvas id="radar-chart"></canvas>
          </div>
          <div class="chart-box half">
            <h4>健康行为统计</h4>
            <canvas id="bar-chart"></canvas>
          </div>
        </div>
        <div class="insights-section">
          <h4>个性化建议</h4>
          <div id="insights-list" class="insights-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 头像选择弹窗 ===== -->
  <div id="avatar-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <h3>选择头像</h3>
        <button onclick="document.getElementById('avatar-modal').style.display='none'">✕</button>
      </div>
      <div class="avatar-picker">
        <span onclick="selectAvatar('😊')">😊</span><span onclick="selectAvatar('😄')">😄</span>
        <span onclick="selectAvatar('🤔')">🤔</span><span onclick="selectAvatar('😌')">😌</span>
        <span onclick="selectAvatar('🧘')">🧘</span><span onclick="selectAvatar('🌟')">🌟</span>
        <span onclick="selectAvatar('🦋')">🦋</span><span onclick="selectAvatar('🌸')">🌸</span>
        <span onclick="selectAvatar('🌿')">🌿</span><span onclick="selectAvatar('🐱')">🐱</span>
        <span onclick="selectAvatar('🦊')">🦊</span><span onclick="selectAvatar('🐼')">🐼</span>
      </div>
    </div>
  </div>

  <!-- ===== 音频播放器 ===== -->
  <div id="audio-player" class="audio-player" style="display:none">
    <div class="player-handle"></div>
    <div class="player-info">
      <div id="player-title" class="player-title">音频名称</div>
    </div>
    <div class="player-progress">
      <span id="player-current">0:00</span>
      <input type="range" id="player-seek" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
      <span id="player-duration">0:00</span>
    </div>
    <div class="player-controls">
      <button onclick="skipAudio(-15)">⏮ 15</button>
      <button id="play-pause-btn" class="play-btn" onclick="togglePlayPause()">▶</button>
      <button onclick="skipAudio(15)">15 ⏭</button>
      <button class="close-player" onclick="closePlayer()">✕</button>
    </div>
    <audio id="audio-element"></audio>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/analysis.js"></script>
</body>
</html>
